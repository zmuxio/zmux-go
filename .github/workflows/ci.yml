name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  test:
    name: ${{ matrix.module.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module:
          - name: root
            path: .
          - name: zmuxquic
            path: zmuxquic
          - name: zmuxh3
            path: zmuxh3
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module.path }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module.path }}/go.mod
          cache-dependency-path: "**/go.sum"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...
