name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module:
          - name: root
            path: .
          - name: zmuxquic
            path: zmuxquic
          - name: zmuxh3
            path: zmuxh3
          - name: zmuxws
            path: zmuxws
          - name: seal
            path: seal
          - name: examples
            path: examples/xorpipe
          - name: webpeer
            path: interop/webpeer
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"

      - name: Local workspace
        working-directory: .
        run: bash tools/ci-workspace.sh

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        # The JSON log keeps every test's output, also of a failure at the
        # end of a package (a leak check after its last test); the console
        # shows the results and what failed.
        env:
          # Keep Windows race binaries at a low, fixed image base for TSan.
          RACE_LDFLAGS: ${{ runner.os == 'Windows' && '-linkmode=external -extldflags=-Wl,--image-base,0x400000,--disable-dynamicbase,--disable-high-entropy-va' || '' }}
        run: |
          race_link=()
          if [[ -n "$RACE_LDFLAGS" ]]; then
            race_link+=("-ldflags=$RACE_LDFLAGS")
          fi
          status=0
          go test -race "${race_link[@]}" -count=1 -json ./... > "$RUNNER_TEMP/test.json" || status=$?
          jq -rj 'select(.Action == "output" and (.Test == null or (.Output | test("^(ok|FAIL|--- FAIL|panic:|    |\\t)")))) | .Output' "$RUNNER_TEMP/test.json"
          exit $status

      - name: test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log-${{ matrix.module.name }}-${{ matrix.os }}
          path: ${{ runner.temp }}/test.json
          if-no-files-found: ignore

  independent:
    name: Published dependencies (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [".", zmuxquic, zmuxws, seal, zmuxh3]
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"
      - name: Build and test without a workspace
        working-directory: ${{ matrix.module }}
        run: go test -mod=readonly ./...

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [".", zmuxquic, zmuxh3, zmuxws, seal, examples/xorpipe, interop/webpeer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"

      - name: Local workspace
        working-directory: .
        run: bash tools/ci-workspace.sh

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: the config enables every linter by default, so a newer release adds checks.
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          # One config for every module; paths in it are relative to it.
          args: --config=${{ github.workspace }}/.golangci.yml

      - name: Staticcheck (all checks)
        working-directory: ${{ matrix.module }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -checks all ./...

  cross:
    name: 32-bit and ARM targets (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [".", seal, zmuxws, zmuxquic, zmuxh3]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"

      - name: Local workspace
        working-directory: .
        run: bash tools/ci-workspace.sh

      # Nothing is run here: a 32-bit int, a 32-bit uintptr and 4-byte
      # alignment of 64-bit atomics fail to compile or vet, not at run time.
      - name: vet linux/386 (includes test code)
        run: GOOS=linux GOARCH=386 go vet ./...

      - name: build windows/386
        run: GOOS=windows GOARCH=386 go build ./...

      - name: build linux/arm
        run: GOOS=linux GOARCH=arm go build ./...

      - name: build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./...

  # A short run of each native fuzz target; the seeds in testdata/fuzz run in
  # every test job already. The weekly workflow fuzzes longer.
  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"

      - name: Local workspace
        working-directory: .
        run: bash tools/ci-workspace.sh

      - name: fuzz
        run: tools/fuzz.sh 10s

      - name: failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-inputs
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
