version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Update external dependencies. Sibling module requirements follow the
  # release order, and QUIC dependencies are checked in the weekly workflow.
  - package-ecosystem: gomod
    directories:
      - /
      - /seal
      - /zmuxws
      - /examples/xorpipe
      - /interop/webpeer
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      - dependency-name: github.com/zmuxio/zmux-go
      - dependency-name: github.com/zmuxio/zmux-go/*
      - dependency-name: github.com/quic-go/quic-go
      - dependency-name: github.com/quic-go/webtransport-go

  # The modules that build on quic-go: it stays pinned until webtransport-go
  # follows (the weekly workflow tests zmuxquic against the latest quic-go).
  - package-ecosystem: gomod
    directories:
      - /zmuxquic
      - /zmuxh3
      - /interop/dgpeer
    schedule:
      interval: weekly
    groups:
      quic-modules:
        patterns: ["*"]
    ignore:
      - dependency-name: github.com/zmuxio/zmux-go
      - dependency-name: github.com/zmuxio/zmux-go/*
      - dependency-name: github.com/quic-go/quic-go
      - dependency-name: github.com/quic-go/webtransport-go
